# Lifecycle B: runs immediately after segment A + server-side seeding of a
# second registrant. Continues on the already-open TournamentDetail screen.
appId: com.mathisl971.rallia-app
tags: [tournaments]
---
# Close registration (docked bar, always on screen)
- extendedWaitUntil:
    visible:
      id: "cta-close-registration"
    timeout: 10000
- tapOn:
    id: "cta-close-registration"
- extendedWaitUntil:
    visible:
      id: "cta-setup-bracket"
    timeout: 20000

# Open the bracket-setup screen and publish the bracket
- tapOn:
    id: "cta-setup-bracket"
- extendedWaitUntil:
    visible:
      id: "cta-generate-bracket"
    timeout: 20000
- tapOn:
    id: "cta-generate-bracket"
- extendedWaitUntil:
    visible:
      id: "confirm-generate-bracket"
    timeout: 10000
- tapOn:
    id: "confirm-generate-bracket"
- extendedWaitUntil:
    visible: ".*Tournament in progress.*"
    timeout: 30000

# Bracket tab shows the generated final
- tapOn: "Bracket"
- extendedWaitUntil:
    visible: ".*Final.*"
    timeout: 10000
- takeScreenshot: /tmp/maestro-lifecycle-b
