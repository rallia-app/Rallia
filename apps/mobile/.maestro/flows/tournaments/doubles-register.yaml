# E2E (doubles): create a DOUBLES tournament -> open registration ->
# add myself -> partner picker -> search a player -> register the pair.
appId: com.mathisl971.rallia-app
tags: [tournaments]
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "tab-create-fab"
    timeout: 120000
- tapOn:
    id: "tab-create-fab"
- extendedWaitUntil:
    visible:
      id: "action-create-tournament"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "action-create-tournament"
- extendedWaitUntil:
    visible:
      id: "tournament-name-input"
    timeout: 15000
- tapOn:
    id: "tournament-name-input"
- inputText: "Maestro Doubles Cup"
- tapOn: "done"
# Pick the Doubles entry format
- tapOn:
    id: "entry-format-doubles"
- scrollUntilVisible:
    element:
      id: "tournament-start-date"
    direction: DOWN
    timeout: 12000
- tapOn:
    id: "tournament-start-date"
- swipe:
    start: "50%, 78%"
    end: "50%, 68%"
- tapOn:
    id: "tournament-date-done"
- tapOn:
    id: "tournament-end-date"
- tapOn:
    id: "tournament-date-done"
- tapOn:
    id: "tournament-wizard-submit"
- extendedWaitUntil:
    visible: ".*Visibility.*"
    timeout: 10000
- tapOn:
    id: "tournament-wizard-submit"
- extendedWaitUntil:
    visible:
      id: "tournament-success-view"
    timeout: 30000
- tapOn:
    id: "tournament-success-view"

# Open registration, then add myself (triggers the partner picker for doubles)
- extendedWaitUntil:
    visible:
      id: "cta-open-registration"
    timeout: 20000
- tapOn:
    id: "cta-open-registration"
- scrollUntilVisible:
    element:
      id: "cta-add-myself"
    direction: DOWN
    timeout: 12000
- tapOn:
    id: "cta-add-myself"

# Partner picker: search a player, select the row, confirm the pair.
# NOTE: search by a name that returns one staging player in this sport, and
# tap the row by testID (tapping the name text hits the inner node, and the
# row toggles selection — so tap exactly once).
- extendedWaitUntil:
    visible:
      id: "partner-search-input"
    timeout: 15000
- tapOn:
    id: "partner-search-input"
- inputText: "Ahmed"
- extendedWaitUntil:
    visible: ".*Ahmed Diallo.*"
    timeout: 15000
- tapOn: "Pick your partner"   # dismiss keyboard
- tapOn:
    id: "partner-row-a1000000-0000-0000-0000-000000000039"
- extendedWaitUntil:
    visible: ".*Register with Ahmed.*"
    timeout: 6000
- tapOn:
    id: "partner-confirm"
- extendedWaitUntil:
    visible:
      id: "cta-withdraw"
    timeout: 20000
- takeScreenshot: /tmp/maestro-doubles-registered
