name: Production Submit

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to submit'
        required: true
        type: choice
        default: all
        options:
          - all
          - ios
          - android

concurrency:
  group: production-submit-${{ inputs.platform }}
  cancel-in-progress: false

jobs:
  production-submit:
    name: EAS Production Submit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: '16'
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Write credentials
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          mkdir -p apps/mobile/credentials
          echo "$GOOGLE_SERVICE_ACCOUNT_JSON" > apps/mobile/credentials/play-store-service-account.json
          echo "$ASC_API_KEY_P8" > apps/mobile/credentials/asc-api-key.p8
          echo "ASC key file size: $(wc -c < apps/mobile/credentials/asc-api-key.p8) bytes"

      - name: Submit to app stores
        id: submit
        run: |
          cd apps/mobile
          eas submit --platform ${{ inputs.platform }} --latest --non-interactive

      - name: Notify Discord
        if: success() || failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          PLATFORM="${{ inputs.platform }}"
          if [ "${{ steps.submit.outcome }}" = "success" ]; then
            COLOR=3066993
            TITLE="Production Submit Completed"
            DESCRIPTION="Latest \`${PLATFORM}\` build(s) submitted to the app store(s)"
          else
            COLOR=15158332
            TITLE="Production Submit Failed"
            DESCRIPTION="Failed to submit \`${PLATFORM}\` build(s) to the app store(s)"
          fi

          FIELDS="["
          FIELDS="${FIELDS}{\"name\": \"Workflow\", \"value\": \"[View Logs](${RUN_URL})\", \"inline\": true}"
          FIELDS="${FIELDS}]"

          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          PAYLOAD=$(jq -n \
            --arg title "$TITLE" \
            --argjson color "$COLOR" \
            --arg timestamp "$TIMESTAMP" \
            --arg description "$DESCRIPTION" \
            --argjson fields "$FIELDS" \
            '{embeds: [{title: $title, description: $description, color: $color, fields: $fields, timestamp: $timestamp, footer: {text: "Rallia Production Submit"}}]}')

          curl -sf -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"
